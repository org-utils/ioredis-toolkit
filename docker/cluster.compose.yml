# A 3-master Redis Cluster in one container. Every node announces 127.0.0.1 and its own port,
# so the addresses in CLUSTER SLOTS and in MOVED/ASK redirects reach the published ports from the host.
# RedisInsight (`--profile insight`, http://localhost:5540) and redis-cli (`run --rm redis-cli`) share the cluster's
# network namespace, so those addresses reach the nodes from inside them too.
# REDIS_CLUSTER_NODES=127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003
services:
  redis-cluster:
    image: redis:8-alpine
    ports: ["7001:7001", "7002:7002", "7003:7003", "5540:5540"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        for port in 7001 7002 7003; do
          mkdir -p /data/$$port
          redis-server --port $$port --dir /data/$$port --protected-mode no \
            --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --cluster-announce-ip 127.0.0.1 \
            --appendonly yes --maxmemory-policy noeviction &
        done
        for port in 7001 7002 7003; do until redis-cli -p $$port ping >/dev/null 2>&1; do sleep 0.1; done; done
        redis-cli -p 7001 cluster info | grep -q cluster_known_nodes:3 \
          || redis-cli --cluster create 127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003 --cluster-replicas 0 --cluster-yes
        wait
    healthcheck:
      test: ["CMD-SHELL", "for port in 7001 7002 7003; do redis-cli -p $$port cluster info | grep -q cluster_state:ok || exit 1; done"]
      interval: 1s
      timeout: 3s
      retries: 30
  redisinsight:
    profiles: [insight]
    image: redis/redisinsight:3.8.0
    network_mode: service:redis-cluster
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5540/api/health"]
      interval: 1s
      timeout: 3s
      retries: 60
  redis-cli:
    profiles: [cli]
    image: redis:8-alpine
    network_mode: service:redis-cluster
    entrypoint: ["redis-cli", "-c", "-p", "7001"]
