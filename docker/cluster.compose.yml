services:
  redis-1:
    image: redis:8-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["7001:6379"]
  redis-2:
    image: redis:8-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["7002:6379"]
  redis-3:
    image: redis:8-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["7003:6379"]
  redis-4:
    image: redis:8-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
  redis-5:
    image: redis:8-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
  redis-6:
    image: redis:8-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
  cluster-init:
    image: redis:8-alpine
    depends_on: [redis-1, redis-2, redis-3, redis-4, redis-5, redis-6]
    command: >-
      sh -c 'sleep 2; yes yes | redis-cli --cluster create redis-1:6379 redis-2:6379 redis-3:6379 redis-4:6379 redis-5:6379 redis-6:6379 --cluster-replicas 1'
