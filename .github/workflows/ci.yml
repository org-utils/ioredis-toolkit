name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck and test
        run: |
            bun run lint
            bun run typecheck
            bun test

      - name: Build
        run: bun run build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run ci:publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Show npm error log
        if: failure()
        run: tail -n 40 ~/.npm/_logs/*.log || true
