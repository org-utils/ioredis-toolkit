name: Release

on:
  push:
    branches:
      - main

# One release run at a time on a branch. GitHub can deliver one merge's push twice, and two runs publishing
# together race npm: the second sees the version as unpublished and fails with E409. Queued, it finds nothing to publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run ci:publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Show npm error log
        if: failure()
        run: tail -n 40 ~/.npm/_logs/*.log || true
