name: Release

on:
  push:
    branches:
      - main

# One release run at a time on a branch. GitHub can deliver one merge's push twice, and two runs publishing
# together race npm: the second sees the version as unpublished and fails with E409. Queued, it finds nothing to publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # v2, not v1: v1 finds what was published by parsing "New tag:" lines, which @changesets/cli 3 no longer
      # prints, so it pushed no tags and created no GitHub releases. v2 reads the CLI's CHANGESETS_OUTPUT events.
      # It no longer writes an .npmrc from NPM_TOKEN; the repo's .npmrc reads the variable instead. push-with-git-cli
      # keeps v1's git pushes, so the version commit `changeset version` makes (commit: true) is pushed as it is.
      - name: Create Release PR or Publish
        uses: changesets/action@v2
        with:
          version-script: bun run version
          publish-script: bun run ci:publish
          push-with-git-cli: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Show npm error log
        if: failure()
        run: tail -n 40 ~/.npm/_logs/*.log || true
